<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration page</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0px;
            padding:0px;

        }
        .secd{

            padding: 10px;
            border: 1px solid black;
            width: 500px;
            position: relative;
            left: 33%;
           
        }
        .heading{
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        .input{
            display: flex;
            justify-content: center;
            
        }
        header{
            display: flex;
            justify-content: center;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-weight: 500;
            font-size: xx-large;
        }
        /* .mainbox{
           

        } */
        form{
           margin :10px;
           
           
        }
        #btn{
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    
        <header>Registration page</header>
        <main class="mainbox">
            <form >
                <section class="secd">
                    <h3 class="heading">Personal</h3>
                    <main class="input">
                    <input type="text" placeholder=" name " required pattern="[a-z]">
                    <input type="email" placeholder="email" required >
                    <input type="number" placeholder="age" max="120" min="18">
                </main>
                </section>
                <section class="secd">
                    <h3 class="heading" >Skills</h3>
                    <main class="input">
                    <input type="text" placeholder="skill1" pattern="[a-z]">
                    <input type="text" placeholder="skill2">
                    <input type="text" placeholder="skill3"> 
                </main>
                </section>
                <section class="secd">
                    <h3 class="heading">Description</label></h3>
                    <main class="input" >
                    <textarea id="Description" class="input" minlength="20" ></textarea>
                </main>
                </section>
                  <section class="secd" id="btn">
                    <button >submit</button>
                
                </section>
                
            </form>
        </main>
